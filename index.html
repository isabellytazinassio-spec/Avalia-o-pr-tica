<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f2f7f2;
        color: #222;
        text-align: center;
        transition: 0.3s;
    }

    header {
        background: #2e7d32;
        color: white;
        padding: 35px 20px;
    }

    header h1 {
        font-size: 40px;
        margin-bottom: 10px;
    }

    header p {
        font-size: 20px;
    }

    main {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .card {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 3px 10px #ccc;
    }

    .card span {
        font-size: 45px;
    }

    .card h2 {
        color: #2e7d32;
        margin: 10px;
    }

    .card p {
        font-size: 18px;
    }

    .acessibilidade {
        margin-top: 30px;
    }

    button {
        background: #2e7d32;
        color: white;
        border: none;
        padding: 14px 18px;
        margin: 5px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #1b5e20;
    }

    footer {
        margin-top: 30px;
        padding: 20px;
        background: #1b5e20;
        color: white;
    }

    .escuro {
        background: #222;
        color: white;
    }

    .escuro .card {
        background: #333;
    }

    .escuro .card h2 {
        color: #81c784;
    }

    @media (max-width: 600px) {
        .cards {
            grid-template-columns: 1fr;
        }

        header h1 {
            font-size: 32px;
        }
    }
</style>
